spring.application.name=tracker

spring.datasource.url=jdbc:sqlite:${DB_PATH:foody.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:foody-dev-secret-change-me-please-0123456789}
app.jwt.expiration-minutes=480

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
