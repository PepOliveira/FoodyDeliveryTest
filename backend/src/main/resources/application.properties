spring.application.name=tracker

# SQLite (single file, one connection to avoid "database is locked")
spring.datasource.url=jdbc:sqlite:${DB_PATH:foody.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (override JWT_SECRET in production; must be >= 32 chars)
app.jwt.secret=${JWT_SECRET:foody-dev-secret-change-me-please-0123456789}
app.jwt.expiration-minutes=480

# CORS (frontend dev server)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
